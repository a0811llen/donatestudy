<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">

<title>悅讀拾光學習陪伴協會｜線上捐款</title>
<style>
:root{--g:#2f6f4f;--red:#d93025}
*{box-sizing:border-box}
body{margin:0;background:#f4efe6;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',Roboto,Arial,sans-serif;color:#2b2b2b;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px}
.dp{display:flex;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12);min-height:640px}
.dp .left{width:440px;flex-shrink:0;position:relative}
.dp .left h1{position:absolute;left:28px;top:28px;margin:0;font-size:30px;color:#7a4a00;font-weight:700;line-height:1.35}
.dp .right{flex:1;padding:26px 36px 32px;display:flex;flex-direction:column;min-width:0}
.steps{display:flex;align-items:center;gap:8px;font-size:13px;color:#9a9a9a;margin-bottom:18px;flex-wrap:wrap}
.steps .on{color:var(--g);font-weight:700}.steps .ar{font-size:9px;color:#b5b5b5}
.org{font-size:15px;color:#b8742a;font-weight:700;margin-bottom:6px}
.intro{font-size:14px;line-height:1.65;color:#444;margin-bottom:16px}
.lab{font-size:14px;font-weight:700;color:var(--g);margin-bottom:8px}
.method{display:flex;margin-bottom:16px;border-radius:12px;overflow:hidden}
.method div{flex:1;text-align:center;padding:12px;font-weight:700;font-size:15px;background:var(--g);color:#fff}
.amounts{min-height:156px}
.amt{height:68px;display:flex;align-items:center;border:2px solid #cfcfcf;border-radius:12px;padding:0 16px;background:#fff;margin-bottom:12px;cursor:pointer;transition:.12s}
.amt .cur{font-weight:700;font-size:15px;color:#555;margin-right:10px}
.amt .val{font-size:30px;font-weight:700;color:#111;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Helvetica Neue',Arial,sans-serif;-webkit-text-stroke:.4px #222;font-synthesis:weight}
.amt input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:30px;font-weight:700;color:#111;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Helvetica Neue',Arial,sans-serif;-webkit-text-stroke:.4px #222;padding:0}
.amt input::placeholder{font-size:17px;font-weight:400;color:#b5b5b5;-webkit-text-stroke:0}
.amt.hl{border-color:var(--g);background:#eef7f1;box-shadow:0 0 0 4px rgba(47,111,79,.15)}
.amt.hl .cur{color:var(--g)}
.amt:hover{border-color:#9bb8a8}
.dp-err{color:var(--red);font-size:14px;min-height:20px;margin:-4px 0 6px}
.dp-btn{margin-top:auto;background:var(--g);color:#fff;text-align:center;font-weight:700;font-size:17px;padding:14px;border-radius:12px;cursor:pointer;border:0;font-family:inherit;width:100%}
.dp-btn:hover{filter:brightness(1.08)}
.done{background:#fff;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,.12);padding:72px 24px;text-align:center;margin-top:60px}
.done h1{margin:0;font-size:30px;color:var(--g)}
@media(max-width:820px){
 .wrap{padding:12px}
 .dp{flex-direction:column;min-height:0}
 .dp .left{width:100%;aspect-ratio:440/640}
 .dp .left h1{font-size:clamp(20px,6vw,30px)}
 .dp .right{padding:22px 18px 26px}
 .amt .val,.amt input{font-size:26px}
 .done{padding:56px 16px;margin-top:24px}.done h1{font-size:24px}
}
</style></head>

<script>
const CONFIG={
  FIXED_GROUP:2,        // 1＝無預設，2＝預設 100，3＝預設 1,000；null 時改由網址 ?g=1/2/3 決定，都沒有則隨機分組
  DEFAULTS:{1:null,2:100,3:1000},
  ENDPOINT:""               // （選填）Google Apps Script 網址；填入後會把捐款頁面的操作紀錄送出
};
let group=CONFIG.FIXED_GROUP;
if(!group){group=parseInt(new URLSearchParams(location.search).get('g'),10);
  if(![1,2,3].includes(group))group=1+Math.floor(Math.random()*3)}
const app=document.getElementById('app');
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

function render(){
  const def=CONFIG.DEFAULTS[group];
  const box=el('div','dp');
  const left=el('div','left');left.appendChild(document.getElementById('svgtpl').content.cloneNode(true));
  left.appendChild(el('h1',null,'讓每個孩子都有機會<br>好好學習'));
  const right=el('div','right');
  right.innerHTML='<div class="steps"><span class="on">填寫捐款金額</span><span class="ar">▶</span><span>填寫捐款人資料及收據</span><span class="ar">▶</span><span>確認填寫資訊</span><span class="ar">▶</span><span>金流資料</span></div>'+
   '<div class="org">悅讀拾光學習陪伴協會</div>'+
   '<div class="intro">悅讀拾光學習陪伴協會，是一個致力於陪伴弱勢家庭孩童學習的非營利組織。協會透過移動閱讀車、社區閱讀角落與課後輔導陪伴，為偏鄉與經濟弱勢的孩子提供學習資源與穩定的陪伴。我們期盼每個孩子都能在閱讀中找到自信與好奇心，不因家庭環境而錯失學習的機會。</div>'+
   '<div class="lab">捐款方式</div><div class="method"><div>單筆捐款</div></div><div class="lab">捐款金額</div>';
  const amounts=el('div','amounts');right.appendChild(amounts);
  const err=el('div','dp-err');right.appendChild(err);
  const next=el('button','dp-btn','下一步 &gt;&gt;');right.appendChild(next);
  box.appendChild(left);box.appendChild(right);app.appendChild(box);

  const t0=performance.now();const ev=[];
  const log=(type,value)=>ev.push({t:Math.round(performance.now()-t0),type,value});
  let sel=def?'default':'custom',focused=false,switches=0,optDef=null;
  if(def){
    optDef=el('div','amt','<span class="cur">NTD</span><span class="val">'+def.toLocaleString('en-US')+'</span>');
    optDef.tabIndex=0;optDef.setAttribute('role','radio');amounts.appendChild(optDef);
  }
  const cus=el('div','amt');const inp=document.createElement('input');
  inp.type='text';inp.inputMode='numeric';inp.placeholder='自行輸入捐款金額';inp.maxLength=9;inp.autocomplete='off';
  const cur=el('span','cur','NTD');cus.appendChild(cur);cus.appendChild(inp);amounts.appendChild(cus);
  function paint(){
    if(optDef)optDef.classList.toggle('hl',sel==='default');
    cus.classList.toggle('hl',sel==='custom'&&(def?true:(focused||inp.value!=='')));
    cur.style.display=(focused||inp.value!=='')?'':'none';
  }
  function choose(s){if(s!==sel){switches++;log('switch_to_'+s,null)}sel=s;err.textContent='';paint()}
  if(optDef){
    optDef.onclick=()=>{choose('default');log('click_default',def)};
    optDef.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();optDef.click()}};
  }
  cus.onclick=()=>inp.focus();
  inp.onfocus=()=>{focused=true;choose('custom');log('focus_custom',inp.value);paint()};
  inp.onblur=()=>{focused=false;paint()};
  inp.oninput=()=>{inp.value=inp.value.replace(/[^\d]/g,'');err.textContent='';log('input',inp.value);paint()};
  paint();
  next.onclick=()=>{
    const amt=sel==='default'?def:(inp.value===''?null:parseInt(inp.value,10));
    if(!amt||amt<1){if(sel==='custom'&&document.activeElement!==inp)inp.focus();err.textContent='請選擇或輸入捐款金額';return}
    const rec={group,default_amount:def??'',final_amount:amt,final_source:sel,
      kept_default:def?(sel==='default'):'',changed_from_default:def?(sel==='custom'):'',
      n_switches:switches,time_on_page_ms:Math.round(performance.now()-t0),events:JSON.stringify(ev),
      submittedAt:new Date().toISOString(),ua:navigator.userAgent};
    window.__record=rec;
    if(CONFIG.ENDPOINT){try{fetch(CONFIG.ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)})}catch(e){}}
    app.innerHTML='';window.scrollTo(0,0);
    app.appendChild(el('div','done','<h1>請回到原問卷繼續作答</h1>'));
  };
}
render();
</script></body></html>
